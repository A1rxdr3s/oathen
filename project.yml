# Oathen — XcodeGen Project Specification
# Sprint 1: App Shell
# Generate: xcodegen generate
# ─────────────────────────────────────────
# Public brand: Oathen  |  Internal: Discipline OS
# ─────────────────────────────────────────

name: Oathen

options:
  bundleIdPrefix: com.oathen
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

targets:

  # ──────────────────────────────────────
  # Oathen — iOS + macOS multiplatform app
  # ──────────────────────────────────────
  Oathen:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Oathen
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oathen.app
        PRODUCT_NAME: Oathen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oathen
        INFOPLIST_KEY_NSHumanReadableDescription: "Personal Accountability OS"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  # ──────────────────────────────────────
  # OathenWatch — watchOS placeholder
  # ──────────────────────────────────────
  OathenWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: OathenWatch
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oathen.watch
        PRODUCT_NAME: OathenWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oathen
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
